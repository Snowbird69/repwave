<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<meta name="theme-color" content="#0c0718">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>IronLog</title>
<style>
/* ---------- outrun tokens (sRGB base) ---------- */
:root{
  --bg:#0c0718; --surface:#161028; --raise:#211739; --line:#332457;
  --ink:#f3eeff; --dim:#9a8fc4; --faint:#655a8f;
  --pink:#ff2d95; --pink-ink:#2a0417;
  --cyan:#19dcff; --cyan-ink:#031a20;
  --sun1:#ffd34d; --sun2:#ff7a59;
  --ok:#2bffc6; --ok-ink:#03201a;
  --danger:#ff4365;
  --glow-pink:rgba(255,45,149,.45); --glow-cyan:rgba(25,220,255,.35);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
/* wide-gamut screens (iPhone OLED): push the neons into Display-P3; sRGB above is the fallback */
@media (color-gamut: p3){
  :root{
    --pink:color(display-p3 1 .14 .56);
    --cyan:color(display-p3 .1 .88 1);
    --sun1:color(display-p3 1 .84 .3);
    --sun2:color(display-p3 1 .5 .32);
    --ok:color(display-p3 .22 1 .78);
    --danger:color(display-p3 1 .27 .4);
    --glow-pink:color(display-p3 1 .14 .56 / .45);
    --glow-cyan:color(display-p3 .1 .88 1 / .35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 24px}

h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);
  text-shadow:0 0 10px var(--glow-cyan)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.rowflex{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

button{font:inherit;color:inherit;background:var(--raise);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--cyan);outline-offset:2px}
.btn-primary{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:800;
  box-shadow:0 0 18px var(--glow-pink)}
.btn-cyan{background:transparent;border-color:var(--cyan);color:var(--cyan)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--dim);padding:8px 10px}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn-solid-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.btn-wide{width:100%;padding:14px;font-size:17px;border-radius:12px}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
input[type=number]{font-family:var(--mono);text-align:center;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{width:100%;min-height:64px;resize:vertical}
label.fld{display:block;margin:10px 0}
label.fld>span{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* set rows */
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin:8px 0}
.setrow .sn{font-family:var(--mono);color:var(--faint);font-size:13px;text-align:center}
.stepper{display:grid;grid-template-columns:36px 1fr 36px;gap:0;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;border-radius:0;background:var(--raise);padding:10px 0;font-size:18px;line-height:1;font-family:var(--mono)}
.stepper input{border:0;border-radius:0;background:transparent;padding:10px 2px;width:100%;min-width:0}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  font-size:18px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);font-weight:800;
  box-shadow:0 0 12px var(--glow-cyan)}
.collabels{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.collabels span:nth-child(2),.collabels span:nth-child(3){text-align:center}

/* progression chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;
  padding:3px 8px;border-radius:999px;letter-spacing:.04em;vertical-align:2px}
.chip-up{background:var(--pink);color:#fff;font-weight:700;box-shadow:0 0 10px var(--glow-pink)}
.chip-top{border:1px solid var(--cyan);color:var(--cyan)}
.chip-new{border:1px solid var(--line);color:var(--dim)}
.chip-skip{border:1px solid var(--line);color:var(--faint)}

/* hero: synthwave sun over a perspective grid */
.hero{position:relative;overflow:hidden;padding:22px 16px;border:1px solid var(--line);border-radius:16px;margin:12px 0;
  background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%)}
.hero .sun{position:absolute;right:-26px;top:-34px;width:180px;height:180px;border-radius:50%;
  background:linear-gradient(180deg,var(--sun1) 0%,var(--sun2) 55%,var(--pink) 100%);
  opacity:.9;filter:drop-shadow(0 0 24px var(--glow-pink));overflow:hidden;pointer-events:none}
.hero .sun::after{content:"";position:absolute;left:0;right:0;top:52%;bottom:0;
  background:repeating-linear-gradient(180deg,transparent 0 9px,#130c22 9px 15px)}
.hero::before{content:"";position:absolute;left:-40%;right:-40%;bottom:-8px;height:46%;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,var(--glow-cyan) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(0deg,var(--glow-cyan) 0 1px,transparent 1px 26px);
  opacity:.35;transform:perspective(240px) rotateX(56deg);transform-origin:bottom;
  -webkit-mask:linear-gradient(180deg,transparent,#000 45%);mask:linear-gradient(180deg,transparent,#000 45%)}
.hero>.hero-in{position:relative;z-index:1}
.hero h1{font-size:32px;line-height:1.05;text-transform:uppercase;font-style:italic;letter-spacing:.01em;
  color:var(--ink);
  background:linear-gradient(90deg,var(--cyan) 0%,var(--ink) 45%,var(--pink) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  padding-right:64px}
.hero .why{margin:10px 0 16px;color:var(--dim);font-size:14px}

/* active session header */
.sess-head h2{text-transform:uppercase;font-style:italic;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--cyan);white-space:nowrap}
.timer.paused{color:var(--sun1);border-color:var(--sun1)}
.sess-actions{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.sess-actions button{flex:1;min-width:0;padding:9px 6px;font-size:14px}
.paused-note{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--sun1);margin:6px 0}

/* skipped exercise card */
.card.skipped{opacity:.55;background:var(--bg)}
.card.skipped .exname{text-decoration:line-through;text-decoration-color:var(--faint)}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,7,24,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;border-radius:0;padding:10px 0 8px;color:var(--faint);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
nav button.on{color:var(--cyan);text-shadow:0 0 12px var(--glow-cyan)}
nav button .ic{display:block;font-size:18px;margin-bottom:2px}

.exname{font-weight:700;font-size:17px}
.exmeta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.hist-item{border-bottom:1px solid var(--line);padding:10px 0}
.hist-item:last-child{border-bottom:0}
.divider{height:1px;background:var(--line);margin:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--pink);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;
  z-index:20;font-size:14px;opacity:0;transition:opacity .2s;box-shadow:0 0 18px var(--glow-pink)}
.toast.show{opacity:1}
.empty{color:var(--faint);text-align:center;padding:28px 10px;font-size:14px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

/* in-app dialogs (window.prompt/confirm are no-ops in iOS standalone PWAs) */
.modal-wrap{position:fixed;inset:0;background:rgba(5,2,12,.6);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;width:100%;max-width:420px;max-height:70vh;overflow-y:auto;
  box-shadow:0 0 30px rgba(0,0,0,.6),0 0 22px var(--glow-cyan)}
.modal h3{margin:0 0 12px;font-size:17px}
.modal input[type=text]{width:100%}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.m-actions.single{grid-template-columns:1fr}
.m-list{display:grid;gap:8px}
.m-list button{text-align:left}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   IronLog v3 — offline-first training log, outrun edition
   Data lives in localStorage on this device. Export regularly.
   ============================================================ */
"use strict";

const LS_KEY = "ironlog.v1";
const LS_PREIMPORT = "ironlog.backup.preimport";

/* ---------- utilities ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}
function daysAgo(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const then = new Date(y, m-1, d);
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - then) / 86400000);
  return diff <= 0 ? "today" : diff === 1 ? "yesterday" : diff + " days ago";
}
function round2(n){ return Math.round(n*100)/100; }
let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- in-app dialogs ----------
   window.prompt()/confirm() silently no-op when the app runs standalone
   from the iOS home screen, so all dialogs are rendered in-page. */
function appModal(build){
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "modal-wrap";
    const box = document.createElement("div");
    box.className = "modal";
    box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
    wrap.appendChild(box);
    const close = val => { wrap.remove(); resolve(val); };
    wrap.addEventListener("click", ev => { if(ev.target === wrap) close(null); });
    build(box, close);
    document.body.appendChild(wrap);
  });
}
function appConfirm(msg, yesLabel){
  return appModal((box, close) => {
    box.innerHTML = `<h3>${esc(msg)}</h3>
      <div class="m-actions">
        <button data-m="no">Cancel</button>
        <button class="btn-solid-danger" data-m="yes">${esc(yesLabel || "Confirm")}</button>
      </div>`;
    box.querySelector('[data-m="no"]').onclick = () => close(false);
    box.querySelector('[data-m="yes"]').onclick = () => close(true);
  }).then(v => v === true);
}
function appPrompt(msg, opts){
  const o = opts || {};
  return appModal((box, close) => {
    box.innerHTML = `<h3>${esc(msg)}</h3>
      <input type="text" placeholder="${esc(o.placeholder || "")}" value="${esc(o.value || "")}">
      <div class="m-actions">
        <button data-m="no">Cancel</button>
        <button class="btn-primary" data-m="ok">${esc(o.okLabel || "Add")}</button>
      </div>`;
    const inp = box.querySelector("input");
    const ok = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } close(v); };
    box.querySelector('[data-m="ok"]').onclick = ok;
    box.querySelector('[data-m="no"]').onclick = () => close(null);
    inp.addEventListener("keydown", ev => { if(ev.key === "Enter") ok(); });
    setTimeout(() => inp.focus(), 50);
  });
}
function appPick(title, names){
  return appModal((box, close) => {
    box.innerHTML = `<h3>${esc(title)}</h3>
      <div class="m-list">${names.map((n,i) => `<button data-pick="${i}">${esc(n)}</button>`).join("")}</div>
      <div class="m-actions single"><button data-m="no">Cancel</button></div>`;
    box.querySelector('[data-m="no"]').onclick = () => close(null);
    box.querySelectorAll("[data-pick]").forEach(b => { b.onclick = () => close(Number(b.dataset.pick)); });
  });
}

/* ---------- seed data ---------- */
function seedState(){
  const ex = {};
  const mk = (name, type, muscles, sets, repMin, repMax, increment) => {
    const id = uid();
    ex[id] = {id, name, type, muscles, sets, repMin, repMax, increment};
    return id;
  };
  const bench    = mk("Barbell Bench Press", "barbell",  "chest, triceps", 3, 8, 12, 5);
  const incline  = mk("Incline DB Press",    "dumbbell", "chest, shoulders", 3, 8, 12, 5);
  const dips     = mk("Dips",                "bodyweight","chest, triceps", 3, 6, 12, 0);
  const pushdown = mk("Triceps Pushdown",    "machine",  "triceps", 3, 10, 15, 5);
  const pullups  = mk("Pull-Ups",            "bodyweight","back, biceps", 3, 5, 10, 0);
  const row      = mk("One-Arm DB Row",      "dumbbell", "back", 3, 8, 12, 5);
  const pulldown = mk("Lat Pulldown",        "machine",  "back, biceps", 3, 8, 12, 5);
  const curl     = mk("DB Curl",             "dumbbell", "biceps", 3, 8, 12, 5);
  const tread    = mk("Weighted Vest Treadmill", "cardio", "conditioning", 0, 0, 0, 0);

  const tCT = {id: uid(), name: "Chest / Triceps", exerciseIds: [bench, incline, dips, pushdown]};
  const tBB = {id: uid(), name: "Back / Biceps",   exerciseIds: [pullups, row, pulldown, curl]};

  return {
    version: 1,
    settings: {units: "lb"},
    exercises: ex,
    templates: [tCT, tBB],
    rotation: [tCT.id, tBB.id],
    cardioIds: [tread],
    sessions: [],   // newest first
    active: null,
    tab: "today"
  };
}

/* ---------- state load/save ---------- */
let S;
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ S = seedState(); save(); return; }
    S = JSON.parse(raw);
    if(!S || S.version !== 1) throw new Error("bad schema");
    // migrate: sessions started before v3 lack the timer fields
    if(S.active && !S.active.startedAt){
      S.active.startedAt = Date.now();
      S.active.accumMs = S.active.accumMs || 0;
      S.active.paused = !!S.active.paused;
      save();
    }
  }catch(e){
    console.error("State load failed:", e);
    S = seedState();
  }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast("Save failed — storage full?"); console.error(e); }
}

/* ============================================================
   LOGIC-START  (pure functions — also exercised by tests)
   ============================================================ */

/** Most recent completed performance of an exercise, or null. */
function lastPerformance(exId, sessions){
  for(const s of sessions){
    const e = (s.entries || []).find(en => en.exerciseId === exId);
    if(!e) continue;
    if(e.cardio) return {cardio: e.cardio, date: s.date};
    const done = (e.sets || []).filter(st => st.done);
    if(done.length) return {sets: done, date: s.date};
  }
  return null;
}

/**
 * Double progression: when every target set hit the top of the rep
 * range last time, add the increment and reset reps to the bottom.
 * Otherwise repeat last weight and mirror last reps as the target.
 */
function prefillStrength(ex, sessions){
  const last = lastPerformance(ex.id, sessions);
  if(!last || !last.sets){
    return {kind:"first", sets: Array.from({length: ex.sets}, () => ({w: 0, r: ex.repMin, done:false}))};
  }
  const topW = Math.max(...last.sets.map(s => Number(s.w) || 0));
  const hitTop = last.sets.length >= ex.sets && last.sets.every(s => (Number(s.r)||0) >= ex.repMax);
  if(hitTop && ex.increment > 0){
    return {kind:"progressed", bump: ex.increment,
      sets: Array.from({length: ex.sets}, () => ({w: topW + ex.increment, r: ex.repMin, done:false}))};
  }
  const sets = [];
  for(let i = 0; i < Math.max(ex.sets, last.sets.length); i++){
    const prev = last.sets[i];
    sets.push({w: prev ? Number(prev.w)||0 : topW, r: prev ? Number(prev.r)||ex.repMin : ex.repMin, done:false});
  }
  return {kind: hitTop ? "attop" : "repeat", sets};
}

/** Copy the last cardio numbers forward. */
function prefillCardio(ex, sessions){
  const last = lastPerformance(ex.id, sessions);
  const c = last && last.cardio ? last.cardio : {};
  return {vest: c.vest ?? 0, min: c.min ?? 30, dist: c.dist ?? "", avgHr: c.avgHr ?? "", maxHr: c.maxHr ?? "", cal: c.cal ?? ""};
}

/** Next template in the rotation, based on the last rotation session logged. */
function suggestNextTemplate(state){
  const rot = state.rotation.filter(id => state.templates.some(t => t.id === id));
  if(!rot.length) return state.templates[0] ? state.templates[0].id : null;
  const lastRot = state.sessions.find(s => rot.includes(s.templateId));
  if(!lastRot) return rot[0];
  const i = rot.indexOf(lastRot.templateId);
  return rot[(i + 1) % rot.length];
}

function cardioHasData(c){
  return [c.min, c.dist, c.avgHr, c.maxHr, c.cal].some(v => v !== "" && v !== 0 && v != null);
}

/* ============================================================
   LOGIC-END
   ============================================================ */

/* ---------- session lifecycle ---------- */
function freshEntry(ex){
  const pf = prefillStrength(ex, S.sessions);
  return {exerciseId: ex.id, kind: pf.kind, bump: pf.bump || 0, sets: pf.sets};
}
function startSession(templateId, withCardio){
  const tpl = S.templates.find(t => t.id === templateId) || null;
  const entries = [];
  if(tpl){
    for(const exId of tpl.exerciseIds){
      const ex = S.exercises[exId];
      if(!ex) continue;
      entries.push(freshEntry(ex));
    }
  }
  if(withCardio){
    for(const cid of S.cardioIds){
      const ex = S.exercises[cid];
      if(!ex) continue;
      entries.push({exerciseId: cid, cardio: prefillCardio(ex, S.sessions)});
    }
  }
  S.active = {id: uid(), date: todayStr(), templateId: tpl ? tpl.id : null, entries, notes: "",
              startedAt: Date.now(), accumMs: 0, paused: false};
  save(); render();
}
function finishSession(){
  const a = S.active;
  if(!a) return;
  const kept = [];
  for(const e of a.entries){
    if(e.skipped) continue;
    if(e.cardio){
      if(cardioHasData(e.cardio)) kept.push({exerciseId: e.exerciseId, cardio: e.cardio});
    }else{
      const done = (e.sets || []).filter(st => st.done);
      if(done.length) kept.push({exerciseId: e.exerciseId, sets: e.sets});
    }
  }
  if(!kept.length){ toast("Nothing logged yet"); return; }
  const dur = Math.max(1, Math.round(elapsedMs() / 60000));
  S.sessions.unshift({id: a.id, date: a.date, templateId: a.templateId, entries: kept, notes: a.notes, dur});
  S.active = null;
  save(); render();
  toast("Session saved");
}
async function discardSession(){
  if(!(await appConfirm("Discard this session? Nothing will be saved.", "Discard"))) return;
  S.active = null; save(); render();
}

/* --- workout timer: pause / resume --- */
function elapsedMs(){
  const a = S.active;
  if(!a) return 0;
  return (a.accumMs || 0) + (a.paused ? 0 : Date.now() - a.startedAt);
}
function fmtElapsed(ms){
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? h + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
}
function togglePause(){
  const a = S.active;
  if(!a) return;
  if(a.paused){ a.startedAt = Date.now(); a.paused = false; }
  else{ a.accumMs = (a.accumMs || 0) + (Date.now() - a.startedAt); a.paused = true; }
  save(); render();
}
let tickTimer = null;
function syncTick(){
  clearInterval(tickTimer); tickTimer = null;
  if(S.active && !S.active.paused && S.tab === "today"){
    tickTimer = setInterval(() => {
      const el = document.getElementById("elapsed");
      if(el && S.active) el.textContent = fmtElapsed(elapsedMs());
      else { clearInterval(tickTimer); tickTimer = null; }
    }, 1000);
  }
}

/* --- mid-workout changes: skip / swap / switch day --- */
async function swapEntry(i){
  const cur = S.active.entries[i];
  const curEx = S.exercises[cur.exerciseId];
  const pool = Object.values(S.exercises).filter(e =>
    e.type !== "cardio" && e.id !== cur.exerciseId && !S.active.entries.some(en => en.exerciseId === e.id));
  if(!pool.length){ toast("No other exercises to swap in — add some in Plan"); return; }
  const idx = await appPick("Swap " + (curEx ? curEx.name : "this") + " for…", pool.map(e => e.name));
  if(idx == null || !pool[idx]) return;
  const hasWork = (cur.sets || []).some(st => st.done);
  if(hasWork && !(await appConfirm("This drops the sets already logged for " + (curEx ? curEx.name : "it") + ".", "Swap anyway"))) return;
  S.active.entries[i] = freshEntry(pool[idx]);
  save(); render();
  toast("Swapped to " + pool[idx].name);
}
async function switchDay(){
  const a = S.active;
  const others = S.templates.filter(t => t.id !== a.templateId);
  if(!others.length){ toast("No other day templates yet — add one in Plan"); return; }
  const idx = await appPick("Switch to which day?", others.map(t => t.name));
  if(idx == null || !others[idx]) return;
  const tpl = others[idx];
  // keep cardio and anything with logged sets; replace the untouched strength work
  const kept = a.entries.filter(e => e.cardio || (e.sets || []).some(st => st.done));
  const have = new Set(kept.map(e => e.exerciseId));
  for(const exId of tpl.exerciseIds){
    if(have.has(exId)) continue;
    const ex = S.exercises[exId];
    if(!ex) continue;
    kept.push(freshEntry(ex));
  }
  a.entries = kept;
  a.templateId = tpl.id;
  save(); render();
  toast("Switched to " + tpl.name);
}

  renderTabs();

  if(S.tab === "today")   app.innerHTML = S.active ? viewActive() : viewToday();
  if(S.tab === "history") app.innerHTML = viewHistory();

function renderTabs(){

function tplName(id){ const t = S.templates.find(t => t.id === id); return t ? t.name : "Custom"; }
function previewList(tpl){
  return `<div>` + tpl.exerciseIds.map(id => {

function histEntry(e){
  const ex = S.exercises[e.exerciseId];
  const name = ex ? ex.name : "(deleted exercise)";
  if(e.cardio){
    const c = e.cardio;
    const bits = [];
    if(c.vest) bits.push(c.vest + " " + S.settings.units + " vest");
    if(c.min) bits.push(c.min + " min");
    if(c.dist) bits.push(c.dist + " mi");
    if(c.avgHr) bits.push("avg " + c.avgHr + " bpm");
    if(c.maxHr) bits.push("max " + c.maxHr);
    if(c.cal) bits.push(c.cal + " cal");
    return `<div class="hist-item"><strong>${esc(name)}</strong><div class="num small dim">${bits.join(" · ") || "—"}</div></div>`;
  }
  const done = (e.sets||[]).filter(st => st.done);
  const byW = done.map(st => `${st.w||"BW"}×${st.r}`).join(", ");
  return `<div class="hist-item"><strong>${esc(name)}</strong><div class="num small dim">${byW || "—"}</div></div>`;
}

/* ----- Data (export / import / progress) ----- */
function viewData(){
  const strengthIds = Object.values(S.exercises).filter(e=>e.type!=="cardio").map(e=>e.id);
  const rows = strengthIds.map(id => {
    const ex = S.exercises[id];
    let best = null;
    for(const s of S.sessions) for(const e of (s.entries||[])){
      if(e.exerciseId!==id || !e.sets) continue;
      for(const st of e.sets){ if(st.done && (!best || (st.w||0) > best.w || ((st.w||0)===best.w && st.r>best.r))) best = {w:st.w||0, r:st.r, date:s.date}; }
    }
    return best ? `<div class="spread hist-item"><span>${esc(ex.name)}</span><span class="num dim">${best.w||"BW"} × ${best.r} <span class="small">(${esc(fmtDate(best.date))})</span></span></div>` : "";
  }).join("");
  return `
    <p class="eyebrow">Bests</p>
    <div class="card">${rows || `<div class="empty">Log sessions to see PRs.</div>`}</div>

    <p class="eyebrow" style="margin-top:18px">Backup</p>
    <div class="card">
      <p class="small dim" style="margin-top:0">Everything lives in this phone's browser storage. <strong>Deleting the home-screen app deletes the data</strong> — export regularly.</p>
      <div style="display:grid;gap:8px">
        <button class="btn-primary" data-action="export-copy">Copy backup to clipboard</button>
        <button data-action="export-share">Share backup file…</button>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow" style="margin-bottom:8px">Restore</p>
      <textarea id="importbox" placeholder="Paste a backup here"></textarea>
      <button style="margin-top:8px" data-action="import">Import (replaces current data)</button>
      <p class="small dim">Current data is auto-stashed to a recovery slot before import (<span class="num">${LS_PREIMPORT}</span>).</p>
      ${localStorage.getItem(LS_PREIMPORT) ? `<button class="btn-ghost" data-action="restore-preimport">Undo last import</button>` : ""}
    </div>
    <p class="small dim" style="text-align:center">IronLog · local-only · v3</p>`;
}
function doExport(){ return JSON.stringify(S, null, 0); }
async function exportCopy(){
  try{ await navigator.clipboard.writeText(doExport()); toast("Backup copied"); }
  catch(e){
    appModal((box, close) => {
      box.innerHTML = `<h3>Copy this backup</h3>
        <textarea readonly style="min-height:140px">${esc(doExport())}</textarea>
        <div class="m-actions single"><button data-m="no">Done</button></div>`;
      const ta = box.querySelector("textarea");
      ta.addEventListener("click", () => ta.select());
      box.querySelector('[data-m="no"]').onclick = () => close(null);
    });
  }
}
async function exportShare(){
  const data = doExport();
  const file = new File([data], "ironlog-backup-" + todayStr() + ".json", {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"IronLog backup"}); return; }catch(e){/* cancelled */}
  }else{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download = file.name; a.click(); URL.revokeObjectURL(a.href);
  }
}
function doImport(){
  const raw = $("#importbox").value.trim();
  if(!raw){ toast("Paste a backup first"); return; }
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ toast("Not valid JSON"); return; }
  if(!obj || obj.version !== 1 || !obj.exercises || !Array.isArray(obj.sessions)){ toast("Doesn't look like an IronLog backup"); return; }
  localStorage.setItem(LS_PREIMPORT, JSON.stringify(S));   // move-aside before replace
  S = obj; S.tab = "data"; S.active = S.active || null;
  if(S.active && !S.active.startedAt){ S.active.startedAt = Date.now(); S.active.accumMs = 0; S.active.paused = false; }
  save(); render(); toast("Imported " + obj.sessions.length + " sessions");
}
function restorePreimport(){
  const raw = localStorage.getItem(LS_PREIMPORT);
  if(!raw){ toast("No recovery slot"); return; }
  try{ S = JSON.parse(raw); save(); render(); toast("Restored pre-import data"); }
  catch(e){ toast("Recovery slot corrupted"); }
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-action]");
  if(!b) return;
  const a = b.dataset.action;
  const i = Number(b.dataset.i), j = Number(b.dataset.j);

  if(a === "tab"){ S.tab = b.dataset.tab; save(); render(); }
  else if(a === "start"){ startSession(b.dataset.tpl || null, b.dataset.cardio === "1"); }
  else if(a === "finish"){ finishSession(); }
  else if(a === "discard"){ discardSession(); }
  else if(a === "pause"){ togglePause(); }
  else if(a === "switch-day"){ switchDay(); }
  else if(a === "skip"){ const e = S.active.entries[i]; if(e){ e.skipped = true; save(); render(); } }
  else if(a === "unskip"){ const e = S.active.entries[i]; if(e){ e.skipped = false; save(); render(); } }
  else if(a === "swap"){ swapEntry(i); }
  else if(a === "toggle-done"){ const st = S.active.entries[i].sets[j]; st.done = !st.done; save(); render(); }
  else if(a === "stepw"){ const st = S.active.entries[i].sets[j]; st.w = Math.max(0, round2((Number(st.w)||0) + Number(b.dataset.d))); save(); render(); }
  else if(a === "stepr"){ const st = S.active.entries[i].sets[j]; st.r = Math.max(0, (Number(st.r)||0) + Number(b.dataset.d)); save(); render(); }
  else if(a === "add-set"){ const e = S.active.entries[i]; const lastSet = e.sets[e.sets.length-1]; e.sets.push({w: lastSet?lastSet.w:0, r: lastSet?lastSet.r:0, done:false}); save(); render(); }
  else if(a === "rm-set"){ const e = S.active.entries[i]; if(e.sets.length>1) e.sets.pop(); save(); render(); }
  else if(a === "remove-entry"){ S.active.entries.splice(i,1); save(); render(); }
  else if(a === "add-cardio"){ for(const cid of S.cardioIds){ if(S.exercises[cid]) S.active.entries.push({exerciseId: cid, cardio: prefillCardio(S.exercises[cid], S.sessions)}); } save(); render(); }
  else if(a === "add-ex-menu"){ addExerciseMenu(); }
  else if(a === "del-session"){ if(await appConfirm("Delete this session from history? Export a backup first if unsure.", "Delete")){ S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } }
  else if(a === "rot-up"){ const idx = Number(b.dataset.idx); if(idx>0){ [S.rotation[idx-1],S.rotation[idx]]=[S.rotation[idx],S.rotation[idx-1]]; save(); render(); } }
  else if(a === "tpl-ex-up"){ const t = S.templates.find(t=>t.id===b.dataset.tpl); const idx=Number(b.dataset.idx); if(t&&idx>0){ [t.exerciseIds[idx-1],t.exerciseIds[idx]]=[t.exerciseIds[idx],t.exerciseIds[idx-1]]; save(); render(); } }
  else if(a === "tpl-ex-rm"){ const t = S.templates.find(t=>t.id===b.dataset.tpl); if(t){ t.exerciseIds.splice(Number(b.dataset.idx),1); save(); render(); } }
  else if(a === "tpl-ex-add"){ const t = S.templates.find(t=>t.id===b.dataset.tpl); const sel = document.querySelector(`select[data-role="tpl-add-select"][data-tpl="${t.id}"]`); if(t && sel && sel.value){ t.exerciseIds.push(sel.value); save(); render(); } }
  else if(a === "tpl-new"){ const name = await appPrompt("Name the new day", {placeholder:"e.g. Legs / Core", okLabel:"Add day"}); if(name){ const t={id:uid(),name,exerciseIds:[]}; S.templates.push(t); S.rotation.push(t.id); save(); render(); } }
  else if(a === "ex-new"){ const name = await appPrompt("Name the new exercise", {placeholder:"e.g. Goblet Squat", okLabel:"Add exercise"}); if(name){ const id=uid(); S.exercises[id]={id,name,type:"dumbbell",muscles:"",sets:3,repMin:8,repMax:12,increment:5}; editingExId=id; save(); render(); } }
  else if(a === "ex-del"){ const id=b.dataset.ex; if(await appConfirm("Delete this exercise? History keeps its logged sets, templates drop it.", "Delete")){ delete S.exercises[id]; for(const t of S.templates) t.exerciseIds = t.exerciseIds.filter(x=>x!==id); S.cardioIds = S.cardioIds.filter(x=>x!==id); save(); render(); } }
  else if(a === "export-copy"){ exportCopy(); }
  else if(a === "export-share"){ exportShare(); }
  else if(a === "import"){ doImport(); }
  else if(a === "restore-preimport"){ restorePreimport(); }
});
async function addExerciseMenu(){
  const pool = Object.values(S.exercises).filter(e => e.type!=="cardio" && !S.active.entries.some(en => en.exerciseId===e.id));
  if(!pool.length){ toast("Everything's already in — add new ones in Plan"); return; }
  const idx = await appPick("Add which exercise?", pool.map(e => e.name));
  if(idx == null || !pool[idx]) return;
  S.active.entries.push(freshEntry(pool[idx]));
  save(); render();
}
/* input bindings (commit on change) */
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.bind === "w" || el.dataset.bind === "r"){
    const st = S.active.entries[Number(el.dataset.i)].sets[Number(el.dataset.j)];
    st[el.dataset.bind] = Math.max(0, Number(el.value) || 0);
    save(); render();
  }else if(el.dataset.bind === "cardio"){
    const c = S.active.entries[Number(el.dataset.i)].cardio;
    c[el.dataset.key] = el.value === "" ? "" : Number(el.value);
    save();
  }else if(el.dataset.bind === "notes"){
    S.active.notes = el.value; save();
  }else if(el.dataset.exfield){
    const ex = S.exercises[el.dataset.ex];
    if(!ex) return;
    const f = el.dataset.exfield;
    ex[f] = (["sets","repMin","repMax","increment"].includes(f)) ? Math.max(0, Number(el.value)||0) : el.value;
    editingExId = ex.id;
    save();
    if(f === "type") render();
  }
});

/* ---------- boot ---------- */
load();
render();
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW registration failed:", e));
}
</script>
